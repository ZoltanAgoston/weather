<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a1a">
<meta name="description" content="OMTG Weather - valós idejű 16 napos időjárás-előrejelzés magyar városokra. Open-Meteo és OpenStreetMap adatokkal.">
<title>OMTG Weather — Időjárás jelentés</title>
<link rel="manifest" href="/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#0a0a1a,#1a1a3e,#0f3460);color:#fff;min-height:100vh;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{text-align:center;font-size:1.8rem;margin:10px 0 20px}
.subtitle{text-align:center;opacity:.7;font-size:.9rem;margin-bottom:20px}
.search{display:flex;gap:8px;margin-bottom:20px}
input{flex:1;padding:12px 16px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;border-radius:10px;font-size:1rem;outline:none}
input:focus{border-color:#4facfe}
button{padding:12px 20px;background:linear-gradient(135deg,#4facfe,#5b7fff);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
.status{text-align:center;margin:10px 0;opacity:.8;min-height:20px}
.error{color:#ff6b9d}
.card{background:rgba(255,255,255,.07);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:20px;margin-bottom:14px}
.current-temp{font-size:3.5rem;font-weight:800;text-align:center;margin:10px 0}
.stats{display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;margin-top:12px}
.stat{text-align:center;flex:1;min-width:80px;padding:8px;background:rgba(255,255,255,.05);border-radius:8px}
.stat span{font-size:.7rem;opacity:.7;text-transform:uppercase}
.stat strong{display:block;font-size:1.1rem;margin-top:4px}
.day{display:flex;justify-content:space-between;align-items:center;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.08)}
.day:last-child{border-bottom:none}
.day-name{font-weight:600}
.day-temp{opacity:.9}
footer{text-align:center;padding:20px;opacity:.6;font-size:.8rem}
</style>
</head>
<body>
<div class="container">
  <h1>🌤️ OMTG Weather</h1>
  <p class="subtitle">Valós idejű időjárás-előrejelzés · 16 nap</p>
  <div class="search">
    <input id="cityInput" value="Dunaszeg" placeholder="Város neve (pl. Budapest)...">
    <button id="searchBtn" onclick="load()">🔍</button>
  </div>
  <div id="status" class="status"></div>
  <div id="result"></div>
</div>
<footer>Adatok: <a href="https://open-meteo.com/" style="color:#4facfe">Open-Meteo</a> + <a href="https://nominatim.openstreetmap.org/" style="color:#4facfe">OpenStreetMap</a> · OMTG</footer>
<script>
const WMO={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',77:'❄️',80:'🌦️',81:'🌦️',82:'🌦️',85:'❄️',86:'❄️',95:'⛈️',96:'⛈️',99:'⛈️'};
const WMO_LABEL={0:'Tiszta',1:'Többnyire tiszta',2:'Részben felhős',3:'Borult',45:'Köd',48:'Köd',51:'Szitálás',53:'Szitálás',55:'Szitálás',61:'Eső',63:'Eső',65:'Eső',71:'Hó',73:'Hó',75:'Hó',77:'Hó',80:'Zápor',81:'Zápor',82:'Zápor',85:'Hózápor',86:'Hózápor',95:'Zivatar',96:'Zivatar',99:'Zivatar'};

function setStatus(m, isError) {
  const el = document.getElementById('status');
  el.textContent = m;
  el.className = isError ? 'status error' : 'status';
}

async function load() {
  const city = document.getElementById('cityInput').value.trim() || 'Dunaszeg';
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  document.getElementById('result').innerHTML = '';
  setStatus('Betöltés: ' + city + '...');
  try {
    const res = await fetch('/api/weather?city=' + encodeURIComponent(city));
    if (!res.ok) throw new Error('Szerver hiba (' + res.status + ')');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data);
    setStatus('✅ Frissítve: ' + new Date().toLocaleTimeString('hu-HU'));
  } catch (e) {
    setStatus('❌ ' + e.message, true);
    document.getElementById('result').innerHTML = '<div class="card"><h2>⚠️ Hiba</h2><p>' + e.message + '</p><p style="margin-top:8px;opacity:.7;font-size:.85rem">Próbáld újra, vagy válassz másik várost.</p></div>';
  }
  btn.disabled = false;
}

function render(data) {
  const w = data.weather;
  const c = w.current;
  const icon = WMO[c.weather_code] || '🌡️';
  const label = WMO_LABEL[c.weather_code] || 'Ismeretlen';
  const daily = w.daily;
  
  let html = '<div class="card">';
  html += '<h2 style="text-align:center;font-size:1.1rem;opacity:.8">' + data.geo.display + '</h2>';
  html += '<div style="text-align:center;font-size:2.5rem;margin:4px 0">' + icon + '</div>';
  html += '<div class="current-temp">' + Math.round(c.temperature_2m) + '°C</div>';
  html += '<div style="text-align:center;opacity:.8">' + label + '</div>';
  html += '<div class="stats">';
  html += '<div class="stat"><span>Érzet</span><strong>' + Math.round(c.apparent_temperature) + '°C</strong></div>';
  html += '<div class="stat"><span>Pára</span><strong>' + c.relative_humidity_2m + '%</strong></div>';
  html += '<div class="stat"><span>Szél</span><strong>' + Math.round(c.wind_speed_10m) + ' km/h</strong></div>';
  html += '<div class="stat"><span>Nyomás</span><strong>' + Math.round(c.surface_pressure) + ' hPa</strong></div>';
  html += '<div class="stat"><span>Napkelte</span><strong>' + new Date(daily.sunrise[0]).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'}) + '</strong></div>';
  html += '<div class="stat"><span>Napnyugta</span><strong>' + new Date(daily.sunset[0]).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'}) + '</strong></div>';
  html += '</div></div>';
  
  html += '<div class="card"><h3 style="margin-bottom:12px">📅 16 napos előrejelzés</h3>';
  for (let i = 0; i < daily.time.length; i++) {
    const d = new Date(daily.time[i]);
    const dayName = i === 0 ? 'Ma' : (i === 1 ? 'Holnap' : d.toLocaleDateString('hu-HU', {weekday: 'short', month: 'short', day: 'numeric'}));
    const di = WMO[daily.weather_code[i]] || '🌡️';
    html += '<div class="day"><span>' + di + ' ' + dayName + '</span><span class="day-temp">' + Math.round(daily.temperature_2m_min[i]) + '° / ' + Math.round(daily.temperature_2m_max[i]) + '° · ' + (daily.precipitation_sum[i] || 0).toFixed(1) + 'mm</span></div>';
  }
  html += '</div>';
  
  document.getElementById('result').innerHTML = html;
}

document.getElementById('cityInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') load();
});

load();
</script>
</body>
</html>
